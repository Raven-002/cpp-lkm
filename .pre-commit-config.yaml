# Pre-commit: read-only checks only (no file modifications).
# Run: pre-commit run --all-files
# Install: pre-commit install
#
# Requires: just, uv (dev deps: cmake, clang-format, clang-tidy, cmakelang), bun
# Bootstrap: uv sync --group dev && bun install

repos:
  # C++ format check (no modify)
  - repo: local
    hooks:
      - id: cpp-format-check
        name: C++ format (check)
        entry: just qa-format-cpp
        language: system
        pass_filenames: false

  # C++ lint
  - repo: local
    hooks:
      - id: cpp-lint
        name: C++ lint (clang-tidy)
        entry: just qa-lint-cpp
        language: system
        pass_filenames: false

  # CMake format check (no modify)
  - repo: local
    hooks:
      - id: cmake-format-check
        name: CMake format (check)
        entry: scripts/cmake-format-check.sh
        language: system
        pass_filenames: false

  # CMake lint
  - repo: local
    hooks:
      - id: cmake-lint
        name: CMake lint
        entry: scripts/cmake-lint.sh
        language: system
        pass_filenames: false

  # Markdown lint (bun-managed markdownlint-cli2; pass filenames for staged files)
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: Markdown lint
        entry: bash scripts/markdownlint.sh
        language: system
        pass_filenames: true
        files: ^(docs/|README\.md|\.agents/.*\.md)$

name: ci

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-format clang-tidy g++

      - name: Configure (host)
        run: cmake -B build -DBUILD_MODE=host -DBUILD_KO=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build -V

      - name: C++ format check
        run: cmake --build build --target format-check

      - name: C++ lint
        run: |
          files=$(git ls-files 'src/*.cpp' 'include/*.hpp' 'tests/*.cpp' 'tests/*.hpp' 'compat/*.hpp' | rg -v 'tests/test_nodiscard\.cpp|tests/test_negative_new\.cpp' | while IFS= read -r f; do [[ -f "$f" ]] && echo "$f"; done || true)
          if [ -n "$files" ]; then clang-tidy -p build $files; fi

      - name: CMake format check
        run: |
          pip install 'cmakelang[YAML]'
          bash scripts/cmake-format-check.sh

      - name: CMake lint
        run: bash scripts/cmake-lint.sh

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "docs/**/*.md" "README.md"

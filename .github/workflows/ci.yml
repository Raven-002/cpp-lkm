name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-format clang-tidy g++

      - name: Configure (host)
        # CI scope: host tests run with BUILD_KO=OFF (no kernel module smoke/load).
        run: cmake -B build -DBUILD_MODE=host -DBUILD_KO=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build -V

      - name: C++ format check
        run: cmake --build build --target format-check

      - name: C++ lint
        run: |
          files=$(bash scripts/clang-tidy-files.sh || true)
          if [ -n "$files" ]; then clang-tidy -p build $files; fi

      - name: CMake format check
        run: |
          pip install 'cmakelang[YAML]'
          bash scripts/cmake-format-check.sh

      - name: CMake lint
        run: bash scripts/cmake-lint.sh

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.22.0 "docs/**/*.md" "README.md"

  platform-gcc12_5:
    runs-on: ubuntu-latest
    container:
      image: gcc:12.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake make

      - name: Configure (platform)
        # CI scope: platform compile/tests only with BUILD_KO=OFF.
        run: cmake -B build-platform -DBUILD_MODE=platform -DBUILD_KO=OFF -DCMAKE_CXX_COMPILER=g++

      - name: Build (platform)
        run: cmake --build build-platform -j

      - name: Test (platform)
        run: ctest --test-dir build-platform -V

  ko-build-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ linux-headers-$(uname -r)

      - name: Configure (.ko enabled)
        run: cmake -B build-ko -DBUILD_MODE=host -DBUILD_KO=ON

      - name: Build .ko
        run: cmake --build build-ko -j

format:
  # Line width
  line_width: 100
  
  # Tab size
  tab_size: 4
  use_tab: false
  
  # Separate control and function names with a space
  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  
  # Uppercase commands (Matches official CMake documentation style)
  keyword_case: upper

  # Wrap arguments
  max_pargs_h_wrapped: 3
  max_subgroups_h_wrapped: 2
  wrap_arguments: true

# Parse comments
parse:
  emit_reformat_comments: true
  comment_indent: 2
  bullet_char: '*'
  enum_char: '.'

commands:
  target_link_libraries:
    argument_wrap: always
    group_wrap: 3
  target_include_directories:
    argument_wrap: always
    group_wrap: 3
  target_compile_definitions:
    argument_wrap: always
    group_wrap: 3
  set:
    argument_wrap: auto

lint:
  disabled_codes:
    - C0113  # Missing newline at end of file (formatter handles this)
    - C0301  # Line too long (formatter handles this)
    - C0304  # Missing comment header (too noisy for most projects)
  
  # Function names that take variadic arguments (to avoid false positives)
  function_pattern:
    - target_.*
    - set_.*
  
  # Treat specific variables as global (to avoid 'unused variable' warnings)
  global_var_pattern:
    - CMAKE_.*
    - PROJECT_.*
    - .*_DIR
    - .*_PATH

  fail_on_warning: true
